[package]
name = "event-registry"
version = "0.1.0"
description = "Created with Anchor"
edition = "2021"
license = "BUSL-1.1"

[lib]
crate-type = ["cdylib", "lib"]
name = "event_registry"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
test-bpf = []

[dependencies]
anchor-lang = { version = "0.27.0", features = ["init-if-needed"] }
anchor-spl = "0.27.0"
anchor-safe-math = { git = "https://github.com/Apocentre/anchor-safe-math", tag = "v0.3.0" }
mpl-token-metadata = "1.2.10"
anchor-metaplex = { git = "https://github.com/Apocentre/anchor-metaplex", tag = "v0.7.0" }
common = { path = "../../common" }
ticket-sale = { path = "../ticket-sale", features = ["cpi"] }

[dev-dependencies]
solana-program-test = "1.8.0"
solana-sdk = "1.10.29"
solana-test-utils = { git = "https://github.com/Apocentre/solana-test-utils", version = "0.3.10" }
test-context = "0.1.3"
common-test = { path = "../../common-test" }
