[package]
name = "event-registry"
version = "0.1.0"
description = "Created with Anchor"
edition = "2018"

[lib]
crate-type = ["cdylib", "lib"]
name = "event_registry"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = { git = "https://github.com/coral-xyz/anchor", version = "0.25.0", features = ["init-if-needed"] }
anchor-spl = { git = "https://github.com/coral-xyz/anchor", version = "0.25.0" }
anchor-safe-math = "0.2.0"
mpl-token-metadata = "1.2.10"
anchor-metaplex = { git = "https://github.com/Apocentre/anchor-metaplex", version = "0.4.0" }
common = { path = "../../common" }
ticket-sale = { path = "../ticket-sale", features = ["cpi"] }
