[package]
name = "secondary-market"
version = "0.1.0"
description = "Created with Anchor"
edition = "2021"
license = "BUSL-1.1"

[lib]
crate-type = ["cdylib", "lib"]
name = "secondary_market"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
test-bpf = []

[dependencies]
anchor-lang = { version = "0.25.0", features = ["init-if-needed"] }
anchor-spl = "0.25.0"
anchor-safe-math = "0.2.1"
common = { path = "../../common" }
ticket-sale = { path = "../ticket-sale", features = ["no-entrypoint"] }
ticket-nft = { path = "../ticket-nft", features = ["cpi"] }

[dev-dependencies]
solana-program-test = "1.8.0"
solana-sdk = "1.10.29"
solana-test-utils = { git = "https://github.com/Apocentre/solana-test-utils", version = "0.2.22" }
test-context = "0.1.3"
common-test = { path = "../../common-test" }
